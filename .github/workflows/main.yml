name: Build SP-404 Dance VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  generate-juce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Clone JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Download Cmajor CLI (Linux x64)
        run: |
          URL=$(curl -s https://api.github.com/repos/cmajor-lang/cmajor/releases/latest | grep browser_download_url | grep -i linux | grep -iE 'x64|x86_64|amd64' | grep -E '\.zip"' | head -n 1 | cut -d '"' -f 4)

      - name: Generate JUCE C++ Project
        run: |
          cmaj generate --target=juce --output=JuceExport --jucePath=./JUCE SP404Dance.cmajorpatch
          sed -i "s|$PWD/JUCE|../JUCE|g" JuceExport/CMakeLists.txt

      - name: Upload Generated JUCE Project
        uses: actions/upload-artifact@v4
        with:
          name: JuceExport
          path: JuceExport

  build-windows-vst3:
    needs: generate-juce
    runs-on: windows-latest
    steps:
      - name: Download Generated JUCE Project
        uses: actions/download-artifact@v4
        with:
          name: JuceExport
          path: JuceExport

      - name: Clone JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure & Build Windows VST3
        shell: pwsh
        run: |
          cmake -B build -S JuceExport -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Upload Windows .vst3
        uses: actions/upload-artifact@v4
        with:
          name: SP404Dance-Windows-VST3
          path: build/**/*_artefacts/Release/VST3/*.vst3
